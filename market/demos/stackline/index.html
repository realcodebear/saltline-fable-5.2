<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>叠塔成线 STACKLINE — 盐线市集</title>
<style>

:root{
  --ink:#0b0d0f;--ink2:#14181b;--bone:#e8e4da;--signal:#ffb347;--rust:#d2622a;--steel:#8d9aa3;
  --accent:#ffb347;--line:rgba(232,228,218,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--bone);
  font:400 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(140% 80% at 50% -20%,#171d21 0%,#0b0d0f 58%);
}
header{
  flex:0 0 auto;position:relative;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,24,27,.95),rgba(11,13,15,.7));
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 50%,transparent 100%);opacity:.5;
}
.back{
  justify-self:start;display:inline-block;text-decoration:none;color:var(--steel);font-size:11px;
  letter-spacing:.16em;padding:7px 10px;border:1px solid var(--line);border-radius:2px;white-space:nowrap;
  transition:color .18s ease,border-color .18s ease,background .18s ease;
}
.back:hover,.back:focus-visible{color:var(--accent);border-color:var(--accent);background:rgba(255,179,71,.06);outline:none}
h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;text-indent:.18em}
.readout{justify-self:end;display:flex;align-items:center;gap:16px;font-size:10px;letter-spacing:.18em;color:var(--steel);font-variant-numeric:tabular-nums}
.readout .k{opacity:.65}
.readout b{font-size:15px;font-weight:600;color:var(--bone);margin-left:6px;letter-spacing:.06em}
#sc{color:var(--accent)}
main{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.overlay{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:28px;text-align:center;
  background:radial-gradient(90% 80% at 50% 45%,rgba(11,13,15,.62),rgba(8,10,12,.94));
}
.overlay[hidden]{display:none}
.eyebrow{margin:0;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.9;text-indent:.2em}
.title{margin:0;font-size:clamp(21px,4.6vw,34px);line-height:1.15;letter-spacing:.14em;text-transform:uppercase;text-indent:.14em}
.sub{margin:0;max-width:36ch;color:var(--steel);font-size:12px;letter-spacing:.03em}
.hint{margin:0;max-width:58ch;color:var(--steel);font-size:11px;line-height:1.95;letter-spacing:.03em;opacity:.85}
kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:2px;background:rgba(232,228,218,.05);color:var(--bone);font:inherit;font-size:10px;letter-spacing:.1em}
.btn{
  margin-top:2px;cursor:pointer;appearance:none;border:1px solid var(--accent);background:rgba(255,179,71,.08);
  color:var(--bone);font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  padding:12px 26px;border-radius:2px;text-indent:.3em;transition:background .18s ease,color .18s ease;
}
.btn:hover,.btn:focus-visible{background:var(--accent);color:#0b0d0f;outline:none}
@media (max-width:640px){
  header{grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;row-gap:8px;padding:8px 10px;gap:8px}
  .back{grid-column:1;grid-row:1;justify-self:start;font-size:10px;letter-spacing:.1em;padding:6px 7px}
  .readout{grid-column:3;grid-row:1;justify-self:end;gap:9px;font-size:9px;letter-spacing:.1em}
  .readout b{font-size:13px;margin-left:4px}
  h1{grid-column:1 / 4;grid-row:2;justify-self:center;font-size:10px;letter-spacing:.14em;text-indent:.14em}
  .overlay{gap:12px;padding:20px}
  .title{letter-spacing:.12em;text-indent:.12em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="/market/">← 市集</a>
  <h1>叠塔成线 STACKLINE</h1>
  <div class="readout"><span class="k">层数<b id="sc">0000</b></span><span class="k">最高<b id="bs">0000</b></span></div>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <div class="overlay" id="ov">
    <p class="eyebrow" id="ovEyebrow">盐线市集 / 演示 03</p>
    <h2 class="title" id="ovTitle">叠塔成线 STACKLINE</h2>
    <p class="sub" id="ovSub">每块板都落在正中。每次偏差都会削薄塔身，直到无处可站。</p>
    <p class="hint" id="ovHint"><kbd>空格</kbd> / 点击 / 触摸 落下 &middot; 落得越准，保留的宽度越完整</p>
    <button class="btn" id="ovBtn" type="button">开始</button>
  </div>
</main>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv');
if(!cv){return;}
var ctx=cv.getContext('2d',{alpha:false});
var stage=document.getElementById('stage');
var scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
var ov=document.getElementById('ov');
var ovEyebrow=document.getElementById('ovEyebrow');
var ovTitle=document.getElementById('ovTitle');
var ovSub=document.getElementById('ovSub');
var ovHint=document.getElementById('ovHint');
var ovBtn=document.getElementById('ovBtn');
var KEY='sl.stackline.best';
var TAU=Math.PI*2;
var FONT='600 11px ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';

function loadBest(){try{var v=parseInt(localStorage.getItem(KEY),10);return v>0?v:0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem(KEY,String(v));}catch(e){}}

var best=loadBest();
var W=360,H=240,DPR=1;
var baseY=200,bh=20,playX0=20,playW=320,baseW=200;
var state='ready',paused=false,last=0;
var layers=[],moving=null,debris=[],texts=[];
var cam=0,camT=0,shake=0,combo=0,level=0;
var flashT=0;

function pad(n){n=Math.max(0,Math.floor(n));var s=''+n;while(s.length<4){s='0'+s;}return s;}
function showScore(){scEl.textContent=pad(level);bsEl.textContent=pad(best);}

function resize(){
  var rect=cv.getBoundingClientRect();
  var w=Math.round(rect.width),h=Math.round(rect.height);
  if(w<2){w=stage.clientWidth||360;}
  if(h<2){h=stage.clientHeight||240;}
  var oldX=playX0,oldW=playW,hadTower=layers.length>0&&state!=='ready';
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  W=Math.max(280,w);H=Math.max(220,h);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bh=Math.max(16,Math.min(32,Math.round(H*0.052)));
  baseY=Math.round(H*0.83);
  playX0=Math.round(Math.max(22,W*0.09));
  playW=W-playX0*2;
  if(hadTower&&oldW>0){rescale(oldX,oldW);}else{layout();}
  draw();
}
function rescale(oldX,oldW){
  var k=playW/oldW;
  for(var i=0;i<layers.length;i++){
    layers[i].x=playX0+(layers[i].x-oldX)*k;
    layers[i].w*=k;
  }
  if(moving){
    moving.x=playX0+(moving.x-oldX)*k;
    moving.w*=k;
    moving.maxX=Math.max(playX0,playX0+playW-moving.w);
    if(moving.x<moving.maxX){}
    moving.x=Math.max(playX0,Math.min(moving.maxX,moving.x));
  }
  for(i=0;i<debris.length;i++){
    debris[i].x=playX0+(debris[i].x-oldX)*k;
    debris[i].w*=k;
  }
  updateCamTarget();
  cam=camT;
}

function layout(){
  baseW=Math.round(playW*0.56);
  layers=[{x:Math.round(playX0+(playW-baseW)/2),w:baseW,flash:0}];
  moving=makeMoving();
  debris.length=0;texts.length=0;combo=0;shake=0;level=0;
  cam=0;
  updateCamTarget();
  cam=camT;
  showScore();
}
function makeMoving(){
  var below=layers[layers.length-1];
  var dir=layers.length%2===1?1:-1;
  var w=below.w;
  var maxX=playX0+playW-w;
  var x=dir>0?playX0:maxX;
  return {x:x,w:w,dir:dir,maxX:Math.max(playX0,maxX),v:Math.min(210+layers.length*8,640)};
}
function updateCamTarget(){
  camT=Math.max(0,H*0.40-(baseY-layers.length*bh));
}

function drop(){
  if(state!=='run'||paused){return;}
  var below=layers[layers.length-1];
  var m=moving;
  var l=Math.max(m.x,below.x);
  var r=Math.min(m.x+m.w,below.x+below.w);
  var w=r-l;
  if(!(w>2)){fail();return;}
  var off=Math.abs(m.x-below.x);
  var perfect=off<=3.5&&Math.abs(m.w-below.w)<0.6;
  if(perfect){
    layers.push({x:below.x,w:below.w,flash:1});
    combo++;
    flashT=1;
    texts.push({x:below.x+below.w/2,wy:baseY-(layers.length)*bh,t:0,life:1.1,
      txt:combo>1?('完美 ×'+combo):'完美'});
    shake=Math.min(1,0.25+combo*0.08);
  }else{
    layers.push({x:l,w:w,flash:0});
    combo=0;
    if(m.x<l-0.5){pushDebris(m.x,l-m.x,-1);}
    if(m.x+m.w>r+0.5){pushDebris(r,m.x+m.w-r,1);}
    shake=0.5;
  }
  level=layers.length-1;
  moving=makeMoving();
  updateCamTarget();
  showScore();
}
function pushDebris(x,w,side){
  if(w<0.6){return;}
  debris.push({x:x,y:baseY-layers.length*bh,w:w,h:bh,vy:-30,vx:side*(-40-Math.random()*60),
    rot:0,vr:side*(0.6+Math.random()*1.4)});
  if(debris.length>60){debris.shift();}
}
function fail(){
  state='over';
  shake=1;
  if(level>best){best=level;saveBest(best);}
  showScore();
  ovEyebrow.textContent='塔已倒塌';
  ovTitle.textContent='高度 '+pad(level);
  ovSub.textContent='最高 '+pad(best)+' · 宽度归零';
  ovHint.innerHTML='<kbd>空格</kbd> / 点击屏幕再叠一次';
  ovBtn.textContent='再叠一次';
  ov.hidden=false;
}

function update(dt){
  if(state==='run'&&!paused&&moving){
    var m=moving;
    m.x+=m.dir*m.v*dt;
    if(m.x<=playX0){m.x=playX0;m.dir=1;}
    var mx=playX0+playW-m.w;
    if(m.x>=mx){m.x=mx;m.dir=-1;}
  }
  cam+=(camT-cam)*(1-Math.exp(-7*dt));
  if(shake>0){shake=Math.max(0,shake-dt*2.2);}
  if(flashT>0){flashT=Math.max(0,flashT-dt*3);}
  for(var i=0;i<layers.length;i++){
    if(layers[i].flash>0){layers[i].flash=Math.max(0,layers[i].flash-dt*2.4);}
  }
  for(i=debris.length-1;i>=0;i--){
    var d=debris[i];
    d.vy+=1500*dt;
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;
    if(d.y+cam>H+80){debris.splice(i,1);}
  }
  for(i=texts.length-1;i>=0;i--){
    var t=texts[i];
    t.t+=dt;t.wy+=26*dt;
    if(t.t>=t.life){texts.splice(i,1);}
  }
}

function start(){
  if(state==='run'&&!paused){return;}
  layout();state='run';paused=false;ov.hidden=true;last=0;
}
function resume(){if(state==='run'&&paused){paused=false;ov.hidden=true;last=0;}}
function pause(){
  if(state==='run'&&!paused){
    paused=true;
    ovEyebrow.textContent='叠塔暂停';
    ovTitle.textContent='已暂停';
    ovSub.textContent='焦点已离开——塔在等你。';
    ovHint.innerHTML='<kbd>空格</kbd> / 点击屏幕继续';
    ovBtn.textContent='继续';
    ov.hidden=false;
  }
}

window.addEventListener('keydown',function(e){
  var k=e.key||'',c=e.code||'';
  if(k===' '||c==='Space'||k==='Spacebar'||k==='Enter'||k==='ArrowDown'||c==='ArrowDown'){
    e.preventDefault();
    if(paused){resume();return;}
    if(state==='run'){if(!e.repeat){drop();}return;}
    start();return;
  }
},{passive:false});

stage.addEventListener('pointerdown',function(e){
  if(e.target&&e.target.closest&&e.target.closest('#ov')){return;}
  if(paused){resume();return;}
  if(state!=='run'){start();return;}
  drop();
});
ov.addEventListener('pointerdown',function(e){
  if(e.target===ovBtn){return;}
  e.preventDefault();
  if(paused){resume();}else{start();}
});
ovBtn.addEventListener('click',function(){if(paused){resume();}else{start();}});
window.addEventListener('blur',pause);
document.addEventListener('visibilitychange',function(){if(document.hidden){pause();}});

function drawBg(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0f11');
  g.addColorStop(0.55,'#0d1215');
  g.addColorStop(1,'#080a0c');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  var glow=ctx.createRadialGradient(W/2,H*0.28,0,W/2,H*0.28,Math.max(W,H)*0.62);
  glow.addColorStop(0,'rgba(255,179,71,0.07)');
  glow.addColorStop(0.5,'rgba(210,98,42,0.03)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);
  var step=Math.round(W/9);
  ctx.strokeStyle='rgba(232,228,218,0.028)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(var x=step;x<W;x+=step){
    var off=(cam*0.25)%step;
    ctx.moveTo(x,0);ctx.lineTo(x,H);
  }
  ctx.stroke();
  var lineGap=bh*2;
  var off2=((cam*0.35)%lineGap+lineGap)%lineGap;
  ctx.strokeStyle='rgba(232,228,218,0.022)';
  ctx.beginPath();
  for(var y=off2;y<H;y+=lineGap){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
}

function drawGuide(){
  ctx.strokeStyle='rgba(141,154,163,0.10)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,7]);
  ctx.beginPath();
  ctx.moveTo(playX0-0.5,0);ctx.lineTo(playX0-0.5,H);
  ctx.moveTo(playX0+playW+0.5,0);ctx.lineTo(playX0+playW+0.5,H);
  ctx.stroke();
  ctx.setLineDash([]);
  for(var i=0;i<layers.length;i+=5){
    var sy=baseY-(i+1)*bh+cam;
    if(sy<-10||sy>H+10){continue;}
    ctx.strokeStyle='rgba(141,154,163,0.18)';
    ctx.beginPath();
    ctx.moveTo(playX0-16,sy);ctx.lineTo(playX0-7,sy);
    ctx.stroke();
    if(i%10===0&&i>0){
      ctx.font=FONT;
      ctx.textAlign='right';
      ctx.textBaseline='middle';
      ctx.fillStyle='rgba(141,154,163,0.3)';
      ctx.fillText(''+i,playX0-20,sy);
    }
  }
}

function drawGround(){
  var gy=baseY+cam;
  ctx.fillStyle='#070909';
  ctx.fillRect(0,gy,W,H-gy);
  var g=ctx.createLinearGradient(0,gy-10,0,Math.min(H,gy+40));
  g.addColorStop(0,'rgba(210,98,42,0.14)');
  g.addColorStop(1,'rgba(11,13,15,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,gy-10,W,Math.min(H-gy+10,50));
  ctx.fillStyle='rgba(255,179,71,0.30)';
  ctx.fillRect(0,gy-1,W,1.5);
  var step=42;
  ctx.strokeStyle='rgba(232,228,218,0.05)';
  ctx.beginPath();
  for(var x=-step;x<W+step;x+=step){
    ctx.moveTo(x,gy+6);ctx.lineTo(x-18,H);
  }
  ctx.stroke();
}

function drawBlock(x,y,w,h,i,flash,isTop){
  if(w<=0){return;}
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,i%2?'#28343a':'#2f3c43');
  g.addColorStop(1,'#111719');
  ctx.fillStyle=g;
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(232,228,218,0.26)';
  ctx.fillRect(x,y,Math.max(0,w),Math.max(2,h*0.12));
  ctx.fillStyle='rgba(232,228,218,0.10)';
  ctx.fillRect(x,y+Math.max(2,h*0.12),3,Math.max(0,h*0.66));
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fillRect(x+Math.max(0,w-4),y+1,Math.min(4,w*0.14),h-1);
  ctx.strokeStyle='rgba(11,13,15,0.6)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+0.5,y+0.5,Math.max(0,w-1),h-1);
  if(isTop){
    ctx.fillStyle='rgba(255,179,71,0.85)';
    ctx.fillRect(x,y,w,2);
  }
  if(flash>0){
    ctx.fillStyle='rgba(255,179,71,'+(flash*0.30)+')';
    ctx.fillRect(x,y,w,h);
  }
}

function drawTower(){
  var startI=Math.max(0,Math.floor((baseY+cam-H)/bh)-1);
  for(var i=startI;i<layers.length;i++){
    var L=layers[i];
    var sy=baseY-(i+1)*bh+cam;
    if(sy>H+30){continue;}
    if(sy+bh<-30){break;}
    drawBlock(L.x,sy,L.w,bh,i,L.flash||0,i===layers.length-1);
  }
  if(moving){
    var my=baseY-(layers.length+1)*bh+cam;
    if(my<H+60&&my> -bh*2){
      ctx.save();
      ctx.shadowColor='rgba(255,179,71,0.45)';
      ctx.shadowBlur=18;
      ctx.fillStyle='#3a464e';
      ctx.fillRect(moving.x,my,moving.w,bh);
      ctx.restore();
      ctx.fillStyle='rgba(255,179,71,0.95)';
      ctx.fillRect(moving.x,my,moving.w,2.2);
      ctx.strokeStyle='rgba(232,228,218,0.35)';
      ctx.lineWidth=1;
      ctx.strokeRect(moving.x+0.5,my+0.5,Math.max(0,moving.w-1),bh-1);
      var below=layers[layers.length-1];
      var by=baseY-layers.length*bh+cam;
      ctx.strokeStyle='rgba(255,179,71,0.22)';
      ctx.setLineDash([2,5]);
      ctx.beginPath();
      ctx.moveTo(below.x+0.5,by);ctx.lineTo(below.x+0.5,my+bh);
      ctx.moveTo(below.x+below.w-0.5,by);ctx.lineTo(below.x+below.w-0.5,my+bh);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawDebris(){
  for(var i=0;i<debris.length;i++){
    var d=debris[i];
    var sy=d.y+cam;
    if(sy<-80||sy>H+80){continue;}
    ctx.save();
    ctx.translate(d.x+d.w/2,sy+d.h/2);
    ctx.rotate(d.rot);
    ctx.fillStyle='#1c2429';
    ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
    ctx.fillStyle='rgba(232,228,218,0.14)';
    ctx.fillRect(-d.w/2,-d.h/2,d.w,2);
    ctx.strokeStyle='rgba(11,13,15,0.6)';
    ctx.strokeRect(-d.w/2+0.5,-d.h/2+0.5,Math.max(0,d.w-1),d.h-1);
    ctx.restore();
  }
}

function drawTexts(){
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for(var i=0;i<texts.length;i++){
    var t=texts[i];
    var k=1-t.t/t.life;
    ctx.font='600 12px ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
    ctx.fillStyle='rgba(255,179,71,'+(0.9*k)+')';
    ctx.fillText(t.txt,t.x,t.wy+cam);
  }
}

function draw(){
  var sx=0,sy=0;
  if(shake>0){var m=shake*8;sx=(Math.random()-0.5)*m;sy=(Math.random()-0.5)*m;}
  ctx.save();
  ctx.translate(sx,sy);
  drawBg();
  drawGuide();
  drawGround();
  drawTower();
  drawDebris();
  drawTexts();
  ctx.restore();

  var vg=ctx.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.3,W/2,H*0.5,Math.max(W,H)*0.86);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);

  if(state==='run'&&!paused&&combo>=2){
    ctx.font='600 12px ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,179,71,0.85)';
    ctx.fillText('完美连击 ×'+combo,W/2,14);
  }
  if(paused){
    ctx.fillStyle='rgba(11,13,15,0.35)';
    ctx.fillRect(0,0,W,H);
  }
}

function frame(t){
  requestAnimationFrame(frame);
  if(!last){last=t;draw();return;}
  var dt=(t-last)/1000;
  last=t;
  if(!(dt>0)){dt=0;}
  if(dt>0.05){dt=0.05;}
  if(state==='run'&&!paused){update(dt);}
  else{
    cam+=(camT-cam)*(1-Math.exp(-7*dt));
    for(var i=debris.length-1;i>=0;i--){
      var d=debris[i];
      d.vy+=1500*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;
      if(d.y+cam>H+80){debris.splice(i,1);}
    }
    if(shake>0){shake=Math.max(0,shake-dt*2.2);}
  }
  draw();
}

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
if(window.ResizeObserver){try{new ResizeObserver(resize).observe(stage);}catch(e){}}
resize();
layout();
showScore();
requestAnimationFrame(frame);
})();
</script>
