<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>流光漂移 LUMEN DRIFT — 盐线市集</title>
<style>

:root{
  --ink:#0b0d0f;--ink2:#14181b;--bone:#e8e4da;--signal:#ffb347;--rust:#d2622a;--steel:#8d9aa3;
  --accent:#5fd0e0;--line:rgba(232,228,218,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--bone);
  font:400 13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(140% 80% at 50% -20%,#171d21 0%,#0b0d0f 58%);
}
header{
  flex:0 0 auto;position:relative;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,24,27,.95),rgba(11,13,15,.7));
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 50%,transparent 100%);opacity:.5;
}
.back{
  justify-self:start;display:inline-block;text-decoration:none;color:var(--steel);font-size:11px;
  letter-spacing:.16em;padding:7px 10px;border:1px solid var(--line);border-radius:2px;white-space:nowrap;
  transition:color .18s ease,border-color .18s ease,background .18s ease;
}
.back:hover,.back:focus-visible{color:var(--accent);border-color:var(--accent);background:rgba(255,179,71,.06);outline:none}
h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;text-indent:.18em}
.readout{justify-self:end;display:flex;align-items:center;gap:16px;font-size:10px;letter-spacing:.18em;color:var(--steel);font-variant-numeric:tabular-nums}
.readout .k{opacity:.65}
.readout b{font-size:15px;font-weight:600;color:var(--bone);margin-left:6px;letter-spacing:.06em}
#sc{color:var(--accent)}
main{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.overlay{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:28px;text-align:center;
  background:radial-gradient(90% 80% at 50% 45%,rgba(11,13,15,.62),rgba(8,10,12,.94));
}
.overlay[hidden]{display:none}
.eyebrow{margin:0;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.9;text-indent:.2em}
.title{margin:0;font-size:clamp(21px,4.6vw,34px);line-height:1.15;letter-spacing:.14em;text-transform:uppercase;text-indent:.14em}
.sub{margin:0;max-width:36ch;color:var(--steel);font-size:12px;letter-spacing:.03em}
.hint{margin:0;max-width:58ch;color:var(--steel);font-size:11px;line-height:1.95;letter-spacing:.03em;opacity:.85}
kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:2px;background:rgba(232,228,218,.05);color:var(--bone);font:inherit;font-size:10px;letter-spacing:.1em}
.btn{
  margin-top:2px;cursor:pointer;appearance:none;border:1px solid var(--accent);background:rgba(255,179,71,.08);
  color:var(--bone);font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  padding:12px 26px;border-radius:2px;text-indent:.3em;transition:background .18s ease,color .18s ease;
}
.btn:hover,.btn:focus-visible{background:var(--accent);color:#0b0d0f;outline:none}
@media (max-width:640px){
  header{grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;row-gap:8px;padding:8px 10px;gap:8px}
  .back{grid-column:1;grid-row:1;justify-self:start;font-size:10px;letter-spacing:.1em;padding:6px 7px}
  .readout{grid-column:3;grid-row:1;justify-self:end;gap:9px;font-size:9px;letter-spacing:.1em}
  .readout b{font-size:13px;margin-left:4px}
  h1{grid-column:1 / 4;grid-row:2;justify-self:center;font-size:10px;letter-spacing:.14em;text-indent:.14em}
  .overlay{gap:12px;padding:20px}
  .title{letter-spacing:.12em;text-indent:.12em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="/market/">← 市集</a>
  <h1>流光漂移 LUMEN DRIFT</h1>
  <div class="readout"><span class="k">得分<b id="sc">0000</b></span><span class="k">最高<b id="bs">0000</b></span></div>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <div class="overlay" id="ov">
    <p class="eyebrow" id="ovEyebrow">盐线市集 / 演示 02</p>
    <h2 class="title" id="ovTitle">流光漂移 LUMEN DRIFT</h2>
    <p class="sub" id="ovSub">一艘无重的滑艇浮在暗色光池里。收集光点、避开碎晶，每回合六十秒。</p>
    <p class="hint" id="ovHint"><kbd>←</kbd><kbd>→</kbd> 转向 &middot; <kbd>↑</kbd> 推进 &middot; <kbd>↓</kbd> 刹车 &middot; 触摸：按住拖动飞行</p>
    <button class="btn" id="ovBtn" type="button">开始</button>
  </div>
</main>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv');
if(!cv){return;}
var ctx=cv.getContext('2d',{alpha:false});
var stage=document.getElementById('stage');
var scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
var ov=document.getElementById('ov');
var ovEyebrow=document.getElementById('ovEyebrow');
var ovTitle=document.getElementById('ovTitle');
var ovSub=document.getElementById('ovSub');
var ovHint=document.getElementById('ovHint');
var ovBtn=document.getElementById('ovBtn');
var KEY='sl.lumen.best';
var TAU=Math.PI*2;
var FONT='600 11px ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
var FONT_BIG='600 17px ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';

function loadBest(){try{var v=parseInt(localStorage.getItem(KEY),10);return v>0?v:0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem(KEY,String(v));}catch(e){}}

var best=loadBest();
var W=360,H=240,DPR=1,cx=180,cy=120,R=110;
var state='ready',paused=false,last=0;
var ROUND=60,timeLeft=ROUND,score=0,combo=0,mult=1,comboT=0,shake=0,flash=0;
var ship={x:180,y:120,vx:0,vy:0,a:-Math.PI/2,invuln:0};
var motes=[],shards=[],trail=[],sparks=[],dust=[];
var keys={left:false,right:false,up:false,down:false};
var ptr={x:0,y:0,down:false,on:false};

function pad(n){n=Math.max(0,Math.floor(n));var s=''+n;while(s.length<4){s='0'+s;}return s;}
function showScore(){scEl.textContent=pad(score);bsEl.textContent=pad(best);}
function rng(seed){var s=(seed>>>0)||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

function seedDust(){
  dust.length=0;
  var r=rng(8123);
  for(var i=0;i<70;i++){
    var ang=r()*TAU,rad=Math.sqrt(r())*0.96;
    dust.push({x:rad*Math.cos(ang),y:rad*Math.sin(ang),r:0.5+r()*1.6,a:0.05+r()*0.16,s:0.06+r()*0.2});
  }
}
function resize(){
  var rect=cv.getBoundingClientRect();
  var w=Math.round(rect.width),h=Math.round(rect.height);
  if(w<2){w=stage.clientWidth||360;}
  if(h<2){h=stage.clientHeight||240;}
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  W=Math.max(280,w);H=Math.max(200,h);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=Math.round(W/2);cy=Math.round(H/2);
  R=Math.round(Math.min(W,H)*0.43);
  seedDust();
  if(state==='ready'){ship.x=cx;ship.y=cy;}
  draw();
}

function spawnMote(){
  for(var i=0;i<50;i++){
    var ang=Math.random()*TAU,rad=(0.24+Math.random()*0.66)*(R-26);
    var x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
    if(Math.hypot(x-ship.x,y-ship.y)>96){
      motes.push({x:x,y:y,r:4+Math.random()*3.2,ph:Math.random()*TAU});
      return;
    }
  }
  motes.push({x:cx,y:cy,r:5,ph:0});
}
function spawnShard(){
  var ang=Math.random()*TAU,rad=(0.5+Math.random()*0.44)*R;
  var x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
  if(Math.hypot(x-ship.x,y-ship.y)<150){
    x=cx-Math.cos(ang)*rad;y=cy-Math.sin(ang)*rad;
  }
  var sp=24+Math.random()*52,dir=Math.random()*TAU;
  shards.push({x:x,y:y,vx:Math.cos(dir)*sp,vy:Math.sin(dir)*sp,
    r:9+Math.random()*9,rot:Math.random()*TAU,vr:(Math.random()-0.5)*1.7});
}
function spark(x,y,n,col,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*TAU,s=spd*(0.3+Math.random());
    sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:0.35+Math.random()*0.5,
      c:col,r:0.8+Math.random()*1.8});
  }
  if(sparks.length>320){sparks.splice(0,sparks.length-320);}
}
function reset(){
  timeLeft=ROUND;score=0;combo=0;mult=1;comboT=0;shake=0;flash=0;
  ship.x=cx;ship.y=cy;ship.vx=0;ship.vy=0;ship.a=-Math.PI/2;ship.invuln=0;
  motes.length=0;shards.length=0;trail.length=0;sparks.length=0;
  for(var i=0;i<5;i++){spawnMote();}
  for(i=0;i<4;i++){spawnShard();}
  showScore();
}

function updateTrail(){
  trail.push({x:ship.x,y:ship.y});
  if(trail.length>26){trail.shift();}
}
function updateSparks(dt){
  for(var i=sparks.length-1;i>=0;i--){
    var s=sparks[i];
    s.t+=dt;
    if(s.t>=s.life){sparks.splice(i,1);continue;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    s.vx*=1-2.2*dt;s.vy*=1-2.2*dt;
  }
}
function updateMotes(dt){
  for(var i=0;i<motes.length;i++){
    motes[i].ph+=dt*2.4;
  }
}

function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endRound();return;}
  var thrusting=false;
  if(ptr.down&&ptr.on){
    var dx=ptr.x-ship.x,dy=ptr.y-ship.y,d=Math.hypot(dx,dy);
    if(d>14){
      var target=Math.atan2(dy,dx);
      var diff=((target-ship.a+Math.PI)%TAU+TAU)%TAU-Math.PI;
      ship.a+=diff*Math.min(1,dt*10);
      if(d>28){thrusting=true;}
    }
  }else{
    if(keys.left){ship.a-=3.1*dt;}
    if(keys.right){ship.a+=3.1*dt;}
    if(keys.up){thrusting=true;}
    if(keys.down){ship.vx*=Math.exp(-4.2*dt);ship.vy*=Math.exp(-4.2*dt);}
  }
  var drag=thrusting?1.7:3.0;
  var k=Math.exp(-drag*dt);
  ship.vx*=k;ship.vy*=k;
  if(thrusting){
    ship.vx+=Math.cos(ship.a)*820*dt;
    ship.vy+=Math.sin(ship.a)*820*dt;
  }
  var sp=Math.hypot(ship.vx,ship.vy);
  if(sp>470){ship.vx*=470/sp;ship.vy*=470/sp;}
  ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;

  var dx=ship.x-cx,dy=ship.y-cy,d=Math.hypot(dx,dy),lim=R-14;
  if(d>lim){
    var nx=dx/d,ny=dy/d;
    ship.x=cx+nx*lim;ship.y=cy+ny*lim;
    var dot=ship.vx*nx+ship.vy*ny;
    if(dot>0){ship.vx-=1.55*dot*nx;ship.vy-=1.55*dot*ny;}
    if(Math.random()<0.3){spark(ship.x,ship.y,1,'#5fd0e0',60);}
  }
  if(ship.invuln>0){ship.invuln=Math.max(0,ship.invuln-dt);}
  if(comboT>0){
    comboT-=dt;
    if(comboT<=0){combo=0;mult=1;}
  }
  if(shake>0){shake=Math.max(0,shake-dt*2.4);}
  if(flash>0){flash=Math.max(0,flash-dt*2.2);}

  updateTrail();
  updateMotes(dt);

  for(var i=motes.length-1;i>=0;i--){
    var m=motes[i];
    if(Math.hypot(m.x-ship.x,m.y-ship.y)<m.r+12){
      motes.splice(i,1);
      combo++;
      mult=Math.min(6,1+Math.floor(combo/2));
      comboT=2.6;
      score+=10*mult;
      showScore();
      spark(m.x,m.y,10,'#a8f0f7',120);
      spawnMote();
    }
  }

  var wantShards=Math.min(9,4+Math.floor((ROUND-timeLeft)/11));
  while(shards.length<wantShards){spawnShard();}

  for(i=0;i<shards.length;i++){
    var s=shards[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;
    var sdx=s.x-cx,sdy=s.y-cy,sd=Math.hypot(sdx,sdy),slim=R-s.r;
    if(sd>slim){
      var snx=sdx/sd,sny=sdy/sd;
      s.x=cx+snx*slim;s.y=cy+sny*slim;
      var sdv=s.vx*snx+s.vy*sny;
      if(sdv>0){s.vx-=1.9*sdv*snx;s.vy-=1.9*sdv*sny;}
    }
    if(ship.invuln<=0&&Math.hypot(s.x-ship.x,s.y-ship.y)<s.r+9){
      ship.invuln=1.5;
      timeLeft=Math.max(0.05,timeLeft-4);
      combo=0;mult=1;comboT=0;
      shake=1;flash=1;
      spark(s.x,s.y,22,'#ffb347',180);
      var ang=Math.atan2(ship.y-s.y,ship.x-s.x);
      ship.vx+=Math.cos(ang)*300;ship.vy+=Math.sin(ang)*300;
      if(timeLeft<=0.06){endRound();return;}
    }
  }
  updateSparks(dt);
}

function start(){
  if(state==='run'&&!paused){return;}
  reset();state='run';paused=false;ov.hidden=true;last=0;
}
function resume(){
  if(state==='run'&&paused){paused=false;ov.hidden=true;last=0;}
}
function pause(){
  if(state==='run'&&!paused){
    paused=true;
    ovEyebrow.textContent='漂移暂停';
    ovTitle.textContent='已暂停';
    ovSub.textContent='焦点已离开——光场还亮着。';
    ovHint.innerHTML='<kbd>空格</kbd> / 点击屏幕继续';
    ovBtn.textContent='继续';
    ov.hidden=false;
  }
}
function endRound(){
  if(state!=='run'){return;}
  state='over';
  if(score>best){best=score;saveBest(best);}
  showScore();
  spark(ship.x,ship.y,26,'#5fd0e0',150);
  ovEyebrow.textContent='回合结束';
  ovTitle.textContent='得分 '+pad(score);
  ovSub.textContent='最高 '+pad(best)+' · 最高连锁 ×'+mult;
  ovHint.innerHTML='<kbd>空格</kbd> / 点击屏幕再漂一次';
  ovBtn.textContent='再漂一次';
  ov.hidden=false;
}

window.addEventListener('keydown',function(e){
  var k=e.key||'',c=e.code||'';
  if(k==='ArrowLeft'||c==='ArrowLeft'||k==='a'||k==='A'){keys.left=true;e.preventDefault();return;}
  if(k==='ArrowRight'||c==='ArrowRight'||k==='d'||k==='D'){keys.right=true;e.preventDefault();return;}
  if(k==='ArrowUp'||c==='ArrowUp'||k==='w'||k==='W'){keys.up=true;e.preventDefault();return;}
  if(k==='ArrowDown'||c==='ArrowDown'||k==='s'||k==='S'){keys.down=true;e.preventDefault();return;}
  if(k===' '||c==='Space'||k==='Spacebar'||k==='Enter'){
    e.preventDefault();
    if(paused){resume();}else if(state!=='run'){start();}
  }
},{passive:false});
window.addEventListener('keyup',function(e){
  var k=e.key||'',c=e.code||'';
  if(k==='ArrowLeft'||c==='ArrowLeft'||k==='a'||k==='A'){keys.left=false;}
  if(k==='ArrowRight'||c==='ArrowRight'||k==='d'||k==='D'){keys.right=false;}
  if(k==='ArrowUp'||c==='ArrowUp'||k==='w'||k==='W'){keys.up=false;}
  if(k==='ArrowDown'||c==='ArrowDown'||k==='s'||k==='S'){keys.down=false;}
});

function setPtr(e){
  var r=cv.getBoundingClientRect();
  ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.on=true;
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(e.target&&e.target.closest&&e.target.closest('#ov')){return;}
  if(paused){resume();return;}
  if(state!=='run'){start();return;}
  setPtr(e);ptr.down=true;
  if(cv.setPointerCapture){try{cv.setPointerCapture(e.pointerId);}catch(err){}}
});
cv.addEventListener('pointermove',function(e){ if(ptr.down){setPtr(e);} });
cv.addEventListener('pointerup',function(){ptr.down=false;});
cv.addEventListener('pointercancel',function(){ptr.down=false;});
cv.addEventListener('pointerleave',function(){if(!ptr.down){ptr.on=false;}});
ov.addEventListener('pointerdown',function(e){
  if(e.target===ovBtn){return;}
  e.preventDefault();
  if(paused){resume();}else{start();}
});
ovBtn.addEventListener('click',function(){if(paused){resume();}else{start();}});
window.addEventListener('blur',pause);
document.addEventListener('visibilitychange',function(){if(document.hidden){pause();}});

function drawTrail(){
  if(trail.length<2){return;}
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=1;i<trail.length;i++){
    var t=i/trail.length;
    var a=trail[i-1],b=trail[i];
    ctx.strokeStyle='rgba(95,208,224,'+(0.06+0.3*t*t)+')';
    ctx.lineWidth=1+5*t;
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.restore();
}

function drawMotes(){
  for(var i=0;i<motes.length;i++){
    var m=motes[i];
    var pulse=0.72+0.28*Math.sin(m.ph);
    var grd=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,26*pulse);
    grd.addColorStop(0,'rgba(168,240,247,'+(0.55*pulse)+')');
    grd.addColorStop(0.4,'rgba(95,208,224,0.22)');
    grd.addColorStop(1,'rgba(95,208,224,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(m.x,m.y,26*pulse,0,TAU);ctx.fill();
    ctx.fillStyle='#eafcff';
    ctx.beginPath();ctx.arc(m.x,m.y,m.r*pulse,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(95,208,224,0.8)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(m.x,m.y,m.r*pulse+5,0,TAU);ctx.stroke();
  }
}

function drawShards(){
  for(var i=0;i<shards.length;i++){
    var s=shards[i];
    ctx.save();
    ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    ctx.beginPath();
    var n=5;
    for(var j=0;j<n;j++){
      var a=j/n*TAU;
      var rr=s.r*(0.72+0.28*Math.sin(j*2.3+s.rot*0.2));
      var px=Math.cos(a)*rr,py=Math.sin(a)*rr;
      if(j===0){ctx.moveTo(px,py);}else{ctx.lineTo(px,py);}
    }
    ctx.closePath();
    ctx.fillStyle='#221713';
    ctx.fill();
    ctx.strokeStyle='rgba(210,98,42,0.85)';
    ctx.lineWidth=1.4;ctx.stroke();
    ctx.strokeStyle='rgba(255,179,71,0.6)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-s.r*0.5,-s.r*0.3);ctx.lineTo(s.r*0.2,s.r*0.55);ctx.stroke();
    ctx.restore();
    var g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*1.9);
    g.addColorStop(0,'rgba(210,98,42,0.16)');
    g.addColorStop(1,'rgba(210,98,42,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.9,0,TAU);ctx.fill();
  }
}

function drawShip(){
  var blink=ship.invuln>0&&Math.floor(ship.invuln*12)%2===0;
  ctx.save();
  ctx.translate(ship.x,ship.y);
  ctx.rotate(ship.a+Math.PI/2);
  var g=ctx.createRadialGradient(0,0,0,0,0,40);
  g.addColorStop(0,'rgba(95,208,224,0.30)');
  g.addColorStop(1,'rgba(95,208,224,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,40,0,TAU);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0,-15);ctx.lineTo(11,11);ctx.lineTo(0,6);ctx.lineTo(-11,11);ctx.closePath();
  ctx.fillStyle=blink?'rgba(232,228,218,0.35)':'#e8e4da';
  ctx.fill();
  ctx.strokeStyle='rgba(95,208,224,0.95)';
  ctx.lineWidth=1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,-9);ctx.lineTo(0,3);
  ctx.strokeStyle='rgba(11,13,15,0.6)';
  ctx.lineWidth=2;ctx.stroke();
  if(keys.up||ptr.down){
    ctx.beginPath();
    ctx.moveTo(-4,10);ctx.lineTo(0,19+Math.random()*6);ctx.lineTo(4,10);
    ctx.closePath();
    ctx.fillStyle='rgba(255,179,71,0.8)';
    ctx.fill();
  }
  ctx.restore();
  if(mult>1){
    ctx.font=FONT_BIG;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillStyle='rgba(255,179,71,0.95)';
    ctx.fillText('×'+mult,ship.x,ship.y-24);
  }
}

function drawSparks(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i];
    var k=1-s.t/s.life;
    ctx.globalAlpha=k*0.9;
    ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.5+k),0,TAU);ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawHud(){
  ctx.font=FONT;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(141,154,163,0.85)';
  ctx.fillText('时间',16,14);
  ctx.font=FONT_BIG;
  ctx.fillStyle=timeLeft<10?'#ffb347':'#e8e4da';
  ctx.fillText(timeLeft.toFixed(1),16,28);
  ctx.font=FONT;
  ctx.fillStyle='rgba(141,154,163,0.85)';
  ctx.textAlign='right';
  ctx.fillText('连锁 '+combo, W-16, 14);
  ctx.fillStyle='rgba(232,228,218,0.08)';
  ctx.fillRect(0,H-3,W,3);
  ctx.fillStyle=timeLeft<10?'#ffb347':'#5fd0e0';
  ctx.fillRect(0,H-3,Math.max(0,W*(timeLeft/ROUND)),3);
}

function draw(){
  var sx=0,sy=0;
  if(shake>0){var m=shake*9;sx=(Math.random()-0.5)*m;sy=(Math.random()-0.5)*m;}
  ctx.save();
  ctx.translate(sx,sy);
  var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.74);
  bg.addColorStop(0,'#101a1d');
  bg.addColorStop(0.55,'#0a1012');
  bg.addColorStop(1,'#050708');
  ctx.fillStyle=bg;
  ctx.fillRect(-24,-24,W+48,H+48);

  ctx.strokeStyle='rgba(232,228,218,0.05)';
  ctx.lineWidth=1;
  for(var i=1;i<=4;i++){ctx.beginPath();ctx.arc(cx,cy,R*i/4,0,TAU);ctx.stroke();}
  ctx.strokeStyle='rgba(232,228,218,0.07)';
  for(i=0;i<36;i++){
    var ang=i/36*TAU;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(ang)*(R-2),cy+Math.sin(ang)*(R-2));
    ctx.lineTo(cx+Math.cos(ang)*(R-10),cy+Math.sin(ang)*(R-10));
    ctx.stroke();
  }
  var halo=ctx.createRadialGradient(cx,cy,R*0.84,cx,cy,R*1.1);
  halo.addColorStop(0,'rgba(95,208,224,0)');
  halo.addColorStop(0.6,'rgba(95,208,224,0.10)');
  halo.addColorStop(1,'rgba(95,208,224,0)');
  ctx.fillStyle=halo;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(95,208,224,0.42)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();

  for(i=0;i<dust.length;i++){
    var d=dust[i];
    ctx.globalAlpha=d.a;
    ctx.fillStyle='#e8e4da';
    ctx.fillRect(cx+d.x*R,cy+d.y*R,d.r,d.r);
  }
  ctx.globalAlpha=1;

  drawTrail();
  drawMotes();
  drawShards();
  drawShip();
  drawSparks();
  drawHud();
  ctx.restore();

  var vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.28,cx,cy,Math.max(W,H)*0.82);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.58)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);

  if(flash>0){
    ctx.fillStyle='rgba(210,98,42,'+(flash*0.22)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(paused){
    ctx.fillStyle='rgba(11,13,15,0.35)';
    ctx.fillRect(0,0,W,H);
  }
}

function frame(t){
  requestAnimationFrame(frame);
  if(!last){last=t;draw();return;}
  var dt=(t-last)/1000;
  last=t;
  if(!(dt>0)){dt=0;}
  if(dt>0.05){dt=0.05;}
  if(state==='run'&&!paused){update(dt);}
  else{
    updateSparks(dt);
    updateMotes(dt);
    if(shake>0){shake=Math.max(0,shake-dt*2.4);}
  }
  draw();
}

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
if(window.ResizeObserver){try{new ResizeObserver(resize).observe(stage);}catch(e){}}
resize();
reset();
showScore();
requestAnimationFrame(frame);
})();
</script>
