# 提示词市集 · Nginx 反代（国内服务器常用形态）
# 放到 /etc/nginx/conf.d/market.conf，改 server_name 与 root

upstream market_api {
    server 127.0.0.1:8790;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name market.example.com;

    # 静态文件由 nginx 直接吐，链接游戏本体与市集
    root /var/www/saltline-fable-5.2;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    access_log /var/log/nginx/market.access.log;
    error_log  /var/log/nginx/market.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # 静态资源长缓存
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|gif|ico|woff2?|ttf|mp3|wav)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 市集页面
    location /market/ {
        try_files $uri $uri/ /market/index.html;
    }

    # SSE：必须关缓冲，否则事件攒着不发
    location = /api/admin/events {
        proxy_pass http://market_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        gzip off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 反代
    location /api/ {
        proxy_pass http://market_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传产物由 Node 提供（也可以改成 alias 到 server/data/uploads 走 nginx 直出）
    location /uploads/ {
        proxy_pass http://market_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        expires 5m;
    }

    # 站点首页：游戏本体
    location / {
        try_files $uri $uri/ =404;
    }

    # 内部文件不对外
    location ~ ^/(server|data|\.) {
        return 404;
    }
}
